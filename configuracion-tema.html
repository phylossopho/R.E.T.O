<script>
(function () {
  var t = localStorage.getItem('tema') || 'papel';
  document.documentElement.setAttribute('data-theme', t);
  var a = localStorage.getItem('animaciones');
  if (a === 'off' || a === 'on') {
    document.documentElement.setAttribute('data-anim', a);
  }
  try {
    var forzar = /[?&]anim=1/.test(location.search);
    if (sessionStorage.getItem('reto_anim_tarjetas') && !forzar) {
      document.documentElement.setAttribute('data-anim-tarjetas', 'off');
    } else {
      sessionStorage.setItem('reto_anim_tarjetas', '1');
    }
  } catch (e) {}
})();
</script>

<p>R.E.T.O.</p>
</footer>
<script>
(function () {
  var guardado = localStorage.getItem('tema') || 'papel';
  var campos = document.querySelectorAll('input[name="tema"]');
  for (var i = 0; i < campos.length; i++) {
    if (campos[i].value === guardado) { campos[i].checked = true; }
    campos[i].addEventListener('change', function () {
      document.documentElement.setAttribute('data-theme', this.value);
      localStorage.setItem('tema', this.value);
    });
  }
})();
</script>
