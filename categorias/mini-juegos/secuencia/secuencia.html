<script>
// El tema y el interruptor de animaciones se aplican aqui, en el head, y no al
// final del body: si se hiciera despues, el navegador pintaria primero el
// estado por defecto y luego lo cambiaria, y se veria un destello en cada carga.
(function () {
  var t = localStorage.getItem('tema');
  if (t) { document.documentElement.setAttribute('data-theme', t); }
  var a = localStorage.getItem('animaciones');
  if (a === 'off' || a === 'on') { document.documentElement.setAttribute('data-anim', a); }
  try {
    var forzar = /[?&]anim=1/.test(location.search);
    if (sessionStorage.getItem('reto_anim_tarjetas') && !forzar) {
      document.documentElement.setAttribute('data-anim-tarjetas', 'off');
    } else {
      sessionStorage.setItem('reto_anim_tarjetas', '1');
    }
  } catch (e) {}
})();
</script>
</head>
<body class="pantalla-juego">
<!--
  SIN CABECERA NI PIE, A PROPOSITO
  Es la misma decision del memorama: en una pantalla de juego, el titulo arriba
  y el nombre del sitio abajo son franjas que empujan el tablero y no dicen
  nada mientras se juega.

  EL TITULO NO SE BORRA: SE ESCONDE. Un lector de pantalla lo lee al abrir.
-->
<h1 class="oculto-a-la-vista">Secuencia</h1>
<main>
<section class="sec">

  <!--
    EL TABLERO
    Los botones los pone reto-secuencia.js, no el HTML: cuantos hay, que llevan
    escrito, de que color y con que forma depende de los ajustes, y escribirlos
    aqui seria escribirlos dos veces. El cuadrito del modal de ajustes se arma
    con la misma funcion, asi que lo que se ve ahi es lo que se ve jugando.
  -->
  <div class="sec-tablero" id="tablero" data-botones="4" role="group"
       aria-label="Botones del juego"></div>

  <!--
    EL AVANCE: SIEMPRE EN EL MISMO SITIO
    "Paso 2 de 5" es de las cosas que mas ayudan a llegar al final de una
    tarea. Se puede esconder desde los ajustes, porque a otras personas les
    pone nerviosas. Va debajo del tablero, y su altura esta reservada: asi el
    tablero no salta cuando cambia el texto.
  -->
  <div class="sec-avance" id="avance-caja">
    <p class="sec-ronda" id="ronda"></p>
    <p class="sec-cuenta" id="cuentas"></p>
    <div class="sec-barra" aria-hidden="true">
      <div class="sec-barra-relleno" id="barra"></div>
    </div>
  </div>

  <!--
    EL BOTON DE LA PARTIDA: UN SOLO SITIO, UN SOLO BOTON
    Dice siempre en que momento se esta: "Empezar", "Mirando...", "Tu turno",
    "Seguir"... Asi la persona nunca tiene que adivinar que toca, y nada
    aparece ni desaparece de golpe. Cuando no se puede apretar NO esta
    "disabled": lleva aria-disabled, que se queda en el recorrido del teclado.
    Con "disabled" el foco se perderia justo al apretar "Empezar".
  -->
  <button type="button" class="boton boton--principal sec-accion" id="accion"
          aria-disabled="true">Un momento…</button>

  <p class="sec-mensaje" id="mensaje" data-tipo=""></p>

  <!--
    PARA QUIEN NO VE
    Escondido a la vista, pero SIN "hidden": con hidden el lector de pantalla
    tampoco lo leeria. Se esconde con el recorte de una linea, que si lo lee.
  -->
  <p class="oculto-a-la-vista" id="lector" role="status" aria-live="polite"></p>

</section>
</main>
