<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memorama - R.E.T.O.</title>
<link rel="preload" href="../../../styles/fuentes/nunito.css" as="style">
<link rel="stylesheet" href="../../../styles/fuentes/nunito.css">
<link rel="stylesheet" href="../../../styles/styles.css?v=c85-flexfix">
<script src="../../../scripts/reto-panel-prefs.js?v=c01-0f3ddb54"></script>
<script>
// El tema y el interruptor de animaciones se aplican aqui, en el head, y no al
// final del body: si se hiciera despues, el navegador pintaria primero el
// estado por defecto y luego lo cambiaria, y se veria un destello en cada carga.
(function () {
  var t = localStorage.getItem('tema');
  if (t) { document.documentElement.setAttribute('data-theme', t); }
  var a = localStorage.getItem('animaciones');
  if (a === 'off' || a === 'on') { document.documentElement.setAttribute('data-anim', a); }
  try {
    var forzar = /[?&]anim=1/.test(location.search);
    if (sessionStorage.getItem('reto_anim_tarjetas') && !forzar) {
      document.documentElement.setAttribute('data-anim-tarjetas', 'off');
    } else {
      sessionStorage.setItem('reto_anim_tarjetas', '1');
    }
  } catch (e) {}
})();
</script>
</head>
<body class="pantalla-juego">
<!--
  SIN CABECERA NI PIE, A PROPOSITO
  En una pantalla de juego, el titulo arriba y el nombre del sitio abajo son dos
  franjas que empujan el tablero hacia abajo y no dicen nada mientras se juega.
  En un celular restan altura, y el alto es justo lo que necesita el tablero.

  EL TITULO NO SE BORRA: SE ESCONDE. Sigue estando en la pagina, y un lector de
  pantalla lo lee al abrir, para saber donde esta. Lo que no esta es a la vista.
  Borrarlo de verdad dejaria la pagina sin nombre para quien navega con teclado o
  con lector de pantalla, y eso si es una perdida de verdad.
-->
<h1 class="oculto-a-la-vista">Memorama</h1>
<main>
<section class="memo">

  <!--
    LO UNICO QUE SE VE ES EL TABLERO
    Los ajustes (que tablero y con que dibujitos) y las cuentas (intentos,
    parejas y mejor marca) viven en un modal que se abre desde el panel, con el
    boton de "configurar juego".

    No es que esten escondidos por estetica. Es que mientras se juega, un "0"
    de intentos no sirve de nada: el numero solo cuenta cuando ya acabaste. Y las
    opciones son de las que se cambian UNA vez y ya. Estar delante del tablero es
    justo lo que hace falta para concentrarse.
  -->
  <div class="memo-tablero" id="tablero" data-tamano="4x4" role="group" aria-label="Tablero de cartas"></div>

  <p class="memo-mensaje" id="mensaje" data-tipo=""></p>

  <!--
    PARA QUIEN NO VE
    Este parrafo esta escondido a la vista y solo lo lee el lector de pantalla.
    Cada vez que pasa algo (una pareja, un fallo, el fin) se escribe aqui, y el
    navegador lo lee en voz alta. Sin esto, el juego es injugable sin ver: las
    cartas se voltean y no pasa nada audible.

    NO lleva "hidden" a proposito: con hidden el lector de pantalla tampoco lo
    leeria, y es justo a el a quien le sirve. Se esconde con el recorte de una
    linea, que si lo lee.
  -->
  <p class="oculto-a-la-vista" id="lector" role="status" aria-live="polite"></p>

  <!--
    DONDE SE ARMAN LOS AJUSTES
    Viven fuera de la pagina, en un <dialog> que arma el script del juego. No
    estan en el HTML porque no existen hasta que hay un tablero: depende de lo
    que conteste el servidor, y eso se pregunta al cargar.
  -->
  <div class="oculto-a-la-vista">
    <div id="cfg-tamano"></div>
    <div id="cfg-conjunto"></div>
    <p id="cfg-ayuda"></p>
    <div id="cfg-cuentas">
      Intentos: <span id="cfg-intentos">0</span>,
      Parejas: <span id="cfg-parejas">0 / 0</span>,
      Mejor aquí: <span id="cfg-mejor">—</span>
    </div>
  </div>

</section>
</main>
