<script>
// El tema y el interruptor de animaciones se aplican aqui, en el head, y no al
// final del body: si se hiciera despues, el navegador pintaria primero el
// estado por defecto y luego lo cambiaria, y se veria un destello en cada carga.
(function () {
  var t = localStorage.getItem('tema');
  if (t) { document.documentElement.setAttribute('data-theme', t); }
  var a = localStorage.getItem('animaciones');
  if (a === 'off' || a === 'on') { document.documentElement.setAttribute('data-anim', a); }
  try {
    var forzar = /[?&]anim=1/.test(location.search);
    if (sessionStorage.getItem('reto_anim_tarjetas') && !forzar) {
      document.documentElement.setAttribute('data-anim-tarjetas', 'off');
    } else {
      sessionStorage.setItem('reto_anim_tarjetas', '1');
    }
  } catch (e) {}
})();
</script>
</head>
<body class="pantalla-juego">
<!--
  SIN CABECERA NI PIE, A PROPOSITO
  Es la misma decision del memorama y de Secuencia: en una pantalla de juego,
  el titulo arriba y el nombre del sitio abajo son franjas que empujan el
  tablero y no dicen nada mientras se juega.

  EL TITULO NO SE BORRA: SE ESCONDE. Un lector de pantalla lo lee al abrir.
-->
<h1 class="oculto-a-la-vista">Mahjong</h1>
<main>
<section class="mj">

  <!--
    EL TABLERO
    Las fichas las pone reto-mahjong.js, no el HTML: cuantas hay, que llevan
    escrito, de que color y en que piso depende del nivel y de los ajustes, y
    escribirlas aqui seria escribirlas dos veces. El cuadrito del modal de
    ajustes se arma con la misma funcion, asi que lo que se ve ahi es lo que se
    ve jugando.

    La caja que lo rodea se desplaza cuando las fichas son mas grandes que la
    pantalla (tamanos fijos), y tiene tabindex para que quien use teclado
    pueda moverla con las flechas aunque ninguna ficha tenga el foco.
  -->
  <div class="mj-caja" id="caja" role="region" aria-label="Tablero de Mahjong" tabindex="0">
    <div class="mj-tablero" id="tablero" role="group"
         aria-label="Fichas del juego"></div>
  </div>

  <!--
    CUANTAS QUEDAN: SIEMPRE EN EL MISMO SITIO
    Se puede esconder desde los ajustes, porque a otras personas les pone
    nerviosas. Su altura esta reservada, asi el tablero no salta.
  -->
  <div class="mj-avance" id="avance-caja">
    <p class="mj-restan" id="restan"></p>
    <div class="mj-barra" aria-hidden="true">
      <div class="mj-barra-relleno" id="barra"></div>
    </div>
  </div>

  <p class="mj-mensaje" id="mensaje"></p>

  <!--
    UN BOTON PARA LO QUE TOCA CUANDO NO HAY JUGADAS
    Esta escondido (hidden) hasta que ya no quedan parejas, y entonces ofrece
    revolver. Al terminar la partida dice "Jugar otra vez".
  -->
  <button type="button" class="boton boton--principal mj-accion" id="accion"
          data-que="revolver" hidden>Revolver las fichas</button>

  <!--
    PARA QUIEN NO VE
    Escondido a la vista, pero SIN "hidden": con hidden el lector de pantalla
    tampoco lo leeria. Se esconde con el recorte de una linea, que si lo lee.
  -->
  <p class="oculto-a-la-vista" id="lector" role="status" aria-live="polite"></p>

</section>
</main>
