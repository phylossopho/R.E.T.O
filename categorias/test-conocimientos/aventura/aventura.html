<script>
(function () {
  var t = localStorage.getItem('tema');
  if (t) { document.documentElement.setAttribute('data-theme', t); }
  var a = localStorage.getItem('animaciones');
  if (a === 'off' || a === 'on') { document.documentElement.setAttribute('data-anim', a); }
  try {
    var forzar = /[?&]anim=1/.test(location.search);
    if (sessionStorage.getItem('reto_anim_tarjetas') && !forzar) {
      document.documentElement.setAttribute('data-anim-tarjetas', 'off');
    } else {
      sessionStorage.setItem('reto_anim_tarjetas', '1');
    }
  } catch (e) {}
})();
</script>

<header>
<h1>Aventura Gráfica (Modo RPG)</h1>
</header>
<main class="tst">
<p class="tst-estado" id="estado" role="status" aria-live="polite">Cargando aventura...</p>
<div id="vistas">
  <!-- Pantalla inicial de bienvenida y configuración de aventura -->
  <div class="aventura-container" style="display: flex; flex-direction: column; gap: var(--space-md); align-items: center; text-align: center; padding: var(--space-lg);">
    <div style="font-size: 60px; animation: float 3s ease-in-out infinite;">⚔️🧙‍♂️🏰</div>
    <h2>Bienvenido a la Aventura del Saber</h2>
    <p style="max-width: 500px; line-height: 1.6;">
      Explora el minimapa estilo Pokémon, elige tu avatar, selecciona tus Power-Ups estratégicamente (estilo Yu-Gi-Oh) y enfréntate a las preguntas como batallas RPG.
    </p>
    <div style="display: flex; gap: var(--space-sm); flex-wrap: wrap; justify-content: center; margin-top: var(--space-md);">
      <button type="button" class="panel-opcion boton" id="btn-iniciar-aventura" style="padding: var(--space-sm) var(--space-lg); font-weight: bold; cursor: pointer;">
        🚀 Comenzar Aventura
      </button>
    </div>
  </div>
</div>
</main>
<div class="panel-flotante" data-panel>
  <a class="panel-boton" href="../test-conocimientos.html"
