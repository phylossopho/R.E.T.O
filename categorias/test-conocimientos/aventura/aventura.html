<style>
  /* Roboto Mono (autoalojada, sin pedirla a internet) por defecto para la aventura. */
  #vistas, .aventura-container {
    font-family: var(--aventura-font, "Roboto Mono", ui-monospace, monospace);
  }
  /* Responsive: que nada fuerce un ancho mayor al de la pantalla (celular y tablet) */
  html, body { max-width: 100%; overflow-x: hidden; }
  header h1 { font-size: clamp(1rem, 4.6vw, 2rem); white-space: normal; overflow-wrap: anywhere; }
  main, #vistas { min-width: 0; max-width: 100%; }
  main { padding-bottom: 110px; } /* que el panel flotante no tape el final del contenido */
</style>
<script>
(function () {
  try {
    var t = localStorage.getItem('tema');
    if (t) { document.documentElement.setAttribute('data-theme', t); }
    var a = localStorage.getItem('animaciones');
    if (a === 'off' || a === 'on') { document.documentElement.setAttribute('data-anim', a); }
  } catch (e) {}
  try {
    var forzar = /[?&]anim=1/.test(location.search);
    if (sessionStorage.getItem('reto_anim_tarjetas') && !forzar) {
      document.documentElement.setAttribute('data-anim-tarjetas', 'off');
    } else {
      sessionStorage.setItem('reto_anim_tarjetas', '1');
    }
  } catch (e) {}
})();
</script>
