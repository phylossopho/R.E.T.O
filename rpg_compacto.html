<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Batalla Pokémon Educativa - Compacta</title>
    <style>
        :root {
            --bg-color: #121826;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --purple: #a855f7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
        }

        /* Contenedor Principal tipo Consola Portátil */
        .game-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 1px solid #334155;
            padding: 12px;
            gap: 8px;
        }

        /* --- ESCENA DE BATALLA (MITAD SUPERIOR) --- */
        .battle-scene {
            flex: 1;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border-radius: 12px;
            border: 1px solid #334155;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            overflow: hidden;
        }

        /* Información del Enemigo */
        .enemy-hud {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .enemy-name {
            font-size: 0.9rem;
            font-weight: bold;
            color: #e2e8f0;
        }

        .enemy-title {
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
        }

        /* Avatar del Enemigo y Animaciones */
        .avatar-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .enemy-avatar {
            font-size: 4.5rem;
            filter: drop-shadow(0 0 12px var(--accent-glow));
            transition: transform 0.2s ease, filter 0.3s ease;
        }

        /* Animaciones Pokémon */
        .anim-attack {
            animation: pokemonAttack 0.4s ease-in-out;
        }

        .anim-hit {
            animation: playerHit 0.3s ease-in-out;
        }

        @keyframes pokemonAttack {
            0% { transform: scale(1) translateY(0); }
            30% { transform: scale(0.9) translateY(10px); }
            60% { transform: scale(1.3) translateY(-25px); }
            100% { transform: scale(1) translateY(0); }
        }

        @keyframes playerHit {
            0% { filter: brightness(1); }
            20% { filter: brightness(3) drop-shadow(0 0 20px var(--danger)); }
            40% { transform: translate(-8px, 8px); }
            60% { transform: translate(8px, -8px); }
            80% { transform: translate(-4px, 4px); }
            100% { transform: translate(0, 0); filter: brightness(1); }
        }

        /* Banner de Texto del Juego */
        .action-banner {
            background: rgba(30, 41, 59, 0.9);
            border-left: 4px solid var(--accent);
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 0 6px 6px 0;
            margin-bottom: 4px;
        }

        /* --- HUD DEL JUGADOR (VIDA NUMÉRICA) --- */
        .player-hud {
            background: #1e293b;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hp-label {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-sub);
        }

        .hp-value {
            font-size: 1.1rem;
            font-weight: bold;
            font-family: monospace;
            color: #4ade80;
            transition: color 0.3s ease;
        }

        .hp-value.danger { color: var(--danger); }
        .hp-value.warning { color: var(--warning); }

        /* Estado Alterado */
        .status-badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            display: none;
        }
        .status-badge.active { display: inline-block; }
        .status-poison { background: var(--purple); color: #fff; }
        .status-slow { background: var(--warning); color: #000; }

        /* --- ÁREA DE INTERACCIÓN (MITAD INFERIOR) --- */
        .quiz-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Caja de Pregunta */
        .question-box {
            background: var(--card-bg);
            border: 1px solid #334155;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.3;
            min-height: 52px;
            display: flex;
            align-items: center;
        }

        /* Cuadrícula de Respuestas 2x2 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-option {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text-main);
            padding: 12px 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }

        .btn-option:active {
            transform: scale(0.96);
            background: var(--accent);
            color: #000;
        }

        .btn-option.correct {
            background: var(--success) !important;
            color: #fff !important;
            border-color: var(--success);
        }

        .btn-option.wrong {
            background: var(--danger) !important;
            color: #fff !important;
            border-color: var(--danger);
        }

        /* --- BARRA DE POWER-UPS (AL ALCANCE DEL PULGAR) --- */
        .powerups-bar {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            background: #0f172a;
            padding-top: 4px;
        }

        .btn-powerup {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 8px 4px;
            border-radius: 6px;
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-powerup:active:not(:disabled) {
            transform: scale(0.95);
            background: #334155;
        }

        .btn-powerup:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: transparent;
        }

        .powerup-icon {
            font-size: 1rem;
        }

        /* Ajustes específicos para escritorio/pantallas grandes */
        @media (min-width: 600px) {
            .game-container {
                height: 90vh;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- ESCENA DE BATALLA -->
        <div class="battle-scene" id="battleScene">
            <div class="enemy-hud">
                <div>
                    <div class="enemy-name">Alex el Sabio</div>
                    <div class="enemy-title">Mago Elemental</div>
                </div>
                <div class="status-badge status-slow" id="enemyStatus">Lento</div>
            </div>

            <div class="avatar-area">
                <div class="enemy-avatar" id="enemyAvatar">🧙‍♂️</div>
            </div>

            <div class="action-banner" id="actionBanner">
                ¡Alex se prepara para atacar!
            </div>
        </div>

        <!-- HUD DE JUGADOR (HP NUMÉRICO) -->
        <div class="player-hud">
            <div>
                <span class="hp-label">JUGADOR HP</span>
                <span class="status-badge status-poison" id="playerStatus">Envenenado</span>
            </div>
            <div class="hp-value" id="hpText">6,900 / 8,000</div>
        </div>

        <!-- ÁREA DE PREGUNTA Y RESPUESTAS -->
        <div class="quiz-area">
            <div class="question-box" id="questionBox">
                Cargando desafío...
            </div>

            <div class="options-grid" id="optionsGrid">
                <button class="btn-option">Opción A</button>
                <button class="btn-option">Opción B</button>
                <button class="btn-option">Opción C</button>
                <button class="btn-option">Opción D</button>
            </div>
        </div>

        <!-- BARRA DE POWER-UPS -->
        <div class="powerups-bar">
            <button class="btn-powerup" id="pwSlow" onclick="useSlow()">
                <span class="powerup-icon">⏳</span>
                <span>Ralentizar</span>
            </button>
            <button class="btn-powerup" id="pwHeal" onclick="useHeal()">
                <span class="powerup-icon">💖</span>
                <span>Curar +1.5k</span>
            </button>
            <button class="btn-powerup" id="pwAuto" onclick="useAutoAnswer()">
                <span class="powerup-icon">🎯</span>
                <span>Auto-Respuesta</span>
            </button>
        </div>

    </div>

    <script>
        // ESTADO DEL JUEGO
        let currentHp = 6900;
        const maxHp = 8000;
        let tickDamage = 15; // Daño constante por tiempo
        let damageInterval = null;
        let isAnswering = false;

        // BANCO DE PREGUNTAS
        const questions = [
            {
                q: "Física: ¿Cuál es la unidad de medida de la fuerza en el SI?",
                options: ["Joule", "Pascal", "Newton", "Watt"],
                correct: 2
            },
            {
                q: "Geografía: ¿Cuál es el río más largo del mundo?",
                options: ["Nilo", "Amazonas", "Misisipi", "Yangtsé"],
                correct: 1
            },
            {
                q: "Física: ¿Qué velocidad alcanza la luz en el vacío?",
                options: ["300,000 km/s", "150,000 km/s", "1,000,000 km/s", "30,000 km/s"],
                correct: 0
            }
        ];

        let currentQIndex = 0;

        // ELEMENTOS DEL DOM
        const hpText = document.getElementById('hpText');
        const enemyAvatar = document.getElementById('enemyAvatar');
        const battleScene = document.getElementById('battleScene');
        const actionBanner = document.getElementById('actionBanner');
        const questionBox = document.getElementById('questionBox');
        const optionsGrid = document.getElementById('optionsGrid');

        // INICIALIZACIÓN
        function initGame() {
            updateHpDisplay();
            loadQuestion();
            startHpDrain();
        }

        // BUCLE DE DAÑO EN TIEMPO REAL
        function startHpDrain() {
            if (damageInterval) clearInterval(damageInterval);
            damageInterval = setInterval(() => {
                currentHp = Math.max(0, currentHp - tickDamage);
                updateHpDisplay();
                
                if (currentHp <= 0) {
                    clearInterval(damageInterval);
                    actionBanner.innerText = "¡Has sido derrotado!";
                }
            }, 100);
        }

        // ACTUALIZAR MÓDULO DE HP
        function updateHpDisplay() {
            hpText.innerText = `${currentHp.toLocaleString()} / ${maxHp.toLocaleString()}`;
            
            // Cambio de color según porcentaje de vida
            const ratio = currentHp / maxHp;
            hpText.className = 'hp-value';
            if (ratio < 0.25) hpText.classList.add('danger');
            else if (ratio < 0.5) hpText.classList.add('warning');
        }

        // CARGAR PREGUNTA Y DISPARAR ATAQUE
        function loadQuestion() {
            isAnswering = false;
            const q = questions[currentQIndex];
            questionBox.innerText = q.q;
            optionsGrid.innerHTML = '';

            // Animación de ataque enemigo
            triggerEnemyAttack();

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(index, q.correct, btn);
                optionsGrid.appendChild(btn);
            });
        }

        // ANIMACIÓN TIPO POKÉMON
        function triggerEnemyAttack() {
            enemyAvatar.classList.remove('anim-attack');
            battleScene.classList.remove('anim-hit');
            
            // Reflow para reiniciar CSS animation
            void enemyAvatar.offsetWidth;

            enemyAvatar.classList.add('anim-attack');
            actionBanner.innerText = "¡Alex te ha atacado con una pregunta!";

            setTimeout(() => {
                battleScene.classList.add('anim-hit');
            }, 250);
        }

        // PROCESAR RESPUESTA
        function selectAnswer(selectedIndex, correctIndex, btnElement) {
            if (isAnswering) return;
            isAnswering = true;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                actionBanner.innerText = "¡Correcto! Bloqueaste el impacto.";
            } else {
                btnElement.classList.add('wrong');
                // Castigo extra por error
                currentHp = Math.max(0, currentHp - 800);
                updateHpDisplay();
                actionBanner.innerText = "¡Incorrecto! -800 HP extra.";
            }

            // Siguiente pregunta tras pequeña pausa
            setTimeout(() => {
                currentQIndex = (currentQIndex + 1) % questions.length;
                loadQuestion();
            }, 1200);
        }

        // --- POWER UPS ---
        function useSlow() {
            tickDamage = 5;
            document.getElementById('pwSlow').disabled = true;
            document.getElementById('enemyStatus').classList.add('active');
            actionBanner.innerText = "¡Ataque enemigo ralentizado!";
            setTimeout(() => {
                tickDamage = 15;
                document.getElementById('enemyStatus').classList.remove('active');
            }, 5000);
        }

        function useHeal() {
            currentHp = Math.min(maxHp, currentHp + 1500);
            updateHpDisplay();
            document.getElementById('pwHeal').disabled = true;
            actionBanner.innerText = "¡Te has curado +1,500 HP!";
        }

        function useAutoAnswer() {
            document.getElementById('pwAuto').disabled = true;
            const q = questions[currentQIndex];
            const buttons = optionsGrid.children;
            selectAnswer(q.correct, q.correct, buttons[q.correct]);
        }

        // Arrancar el juego al cargar
        window.onload = initGame;
    </script>
</body>
</html>
