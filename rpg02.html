<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo Frontal RPG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background-color: #0b0b0e; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }
        
        .game-container {
            width: 900px;
            height: 550px;
            border: 4px solid #4a3b5c;
            background: radial-gradient(circle, #241435 0%, #0d0716 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HUD Superior compartido */
        .hud-header {
            display: flex;
            justify-content: space-between;
            background-color: #160c24;
            padding: 12px 20px;
            border-bottom: 3px solid #4a3b5c;
            font-size: 13px;
        }
        .hp-bar { background-color: #331111; height: 8px; width: 120px; border-radius: 2px; display: inline-block; margin-left: 10px; overflow:hidden;}
        .hp-fill-green { background-color: #33ff33; height: 100%; width: 75%; }
        .hp-fill-red { background-color: #ff3333; height: 100%; width: 40%; }

        /* Pantalla de combate centralizada */
        .view-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .enemy-boss {
            font-size: 80px;
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }
        .enemy-boss span { display: block; font-size: 14px; color: #ccb0ff; margin-top: 5px; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Caja de Texto e Interfaz Dividida abajo */
        .quiz-panel {
            background-color: #000;
            border-top: 4px solid #4a3b5c;
            display: grid;
            grid-template-columns: 1fr 220px; /* Pregunta/Respuestas vs PowerUps */
            height: 200px;
        }

        .main-quiz-area {
            display: flex;
            flex-direction: column;
            border-right: 3px solid #4a3b5c;
            padding: 15px;
        }
        .question-text { color: #dcb0ff; font-size: 14px; margin-bottom: 12px; font-weight: bold; }
        
        /* Lista vertical de respuestas (Ideal para textos largos de física) */
        .answers-list { display: flex; flex-direction: column; gap: 8px; }
        .btn-option {
            background-color: #12091c;
            border: 2px solid #321c47;
            color: #fff;
            padding: 8px 12px;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-option:hover { border-color: #a855f7; background-color: #241435; }

        /* Cinturón de herramientas lateral (Power-Ups) */
        .sidebar-powers {
            background-color: #110914;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar-title { font-size: 11px; color: #a855f7; text-align: center; font-weight: bold; margin-bottom: 5px; }
        .btn-power {
            background-color: #1c0d24;
            border: 2px solid #52257a;
            color: #e9d5ff;
            padding: 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }
        .btn-power:hover { background-color: #3b1754; border-color: #d8b4fe; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="hud-header">
            <div>🛡️ CABALLERO: HP 150/200 <div class="hp-bar"><div class="hp-fill-green"></div></div></div>
            <div>🔮 MAGO: HP 40/100 <div class="hp-bar"><div class="hp-fill-red"></div></div></div>
        </div>

        <div class="view-screen">
            <div class="enemy-boss">🧙‍♂️<span>Mago Oscuro de la Termodinámica</span></div>
        </div>

        <div class="quiz-panel">
            <div class="main-quiz-area">
                <div class="question-text">¿Qué enunciado describe la Primera Ley de la Termodinámica?</div>
                <div class="answers-list">
                    <button class="btn-option">A) La energía no se crea ni se destruye, solo se transforma.</button>
                    <button class="btn-option">B) La entropía del universo siempre va en aumento.</button>
                    <button class="btn-option">C) Es imposible alcanzar el cero absoluto de temperatura.</button>
                    <button class="btn-option">D) La fuerza es igual a la masa por la aceleración.</button>
                </div>
            </div>

            <div class="sidebar-powers">
                <div class="sidebar-title">🎒 INVENTARIO</div>
                <button class="btn-power">❤️ Poción de Vida</button>
                <button class="btn-power">👁️ Pergamino Inteligente</button>
                <button class="btn-power">⏳ Reloj de Arena</button>
            </div>
        </div>
    </div>

</body>
</html>
