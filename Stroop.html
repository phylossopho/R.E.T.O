<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stroop</title>
<style>
  :root{
    --bg:#0f0f1a; --card-bg:#1b1c2e; --card-edge:#2c2d45;
    --texto:#f0f0f8; --texto-sec:#9a9ac0; --exito:#4fd18b; --acento:#7c8aff;
    --rojo:#e4572e; --azul:#457b9d; --verde:#2a9d8f; --amarillo:#e9b44c;
    --morado:#8e6cc7; --naranja:#f2994a; --rosa:#e0779e;
    box-sizing:border-box;
  }
  *{box-sizing:inherit;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh; display:flex; justify-content:center;
    padding: calc(20px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));
  }
  .wrap{width:100%; max-width:440px; text-align:center;}
  h1{font-size:1.4rem; margin:0 0 4px;}
  .sub{color:var(--texto-sec); font-size:.85rem; margin:0 0 14px; line-height:1.4;}

  .niveles{display:flex; gap:6px; justify-content:center; margin-bottom:14px;}
  .niveles button{
    background:var(--card-bg); border:1px solid var(--card-edge); color:var(--texto);
    border-radius:8px; padding:7px 14px; font-size:.85rem; cursor:pointer;
  }
  .niveles button.activo{ border-color:var(--acento); color:var(--acento); font-weight:700; }

  .stats{display:flex; justify-content:space-around; font-size:.85rem; color:var(--texto-sec); margin-bottom:14px;}
  .stats strong{color:var(--texto); display:block; font-size:1.1rem;}

  .tablero{
    background:var(--card-bg); border:1px solid var(--card-edge); border-radius:16px;
    padding:28px 20px; margin-bottom:16px; position:relative;
  }
  #regla-badge{
    display:inline-block; font-size:.75rem; font-weight:700; color:var(--acento);
    background:rgba(124,138,255,.12); border-radius:12px; padding:3px 10px; margin-bottom:14px;
  }
  #palabra{
    font-size:2.4rem; font-weight:800; letter-spacing:.02em;
    animation:aparecer .25s ease;
  }
  @keyframes aparecer{ from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);} }
  @keyframes festejo{ 0%{transform:scale(1);} 40%{transform:scale(1.15);} 100%{transform:scale(1);} }
  #palabra.correcto{ animation:festejo .35s ease; }

  #feedback{ min-height:1.3em; font-weight:700; margin-top:10px; font-size:.95rem; }

  #barra-fondo{ height:6px; background:var(--card-edge); border-radius:3px; margin-top:16px; overflow:hidden; display:none; }
  #barra-relleno{ height:100%; width:100%; background:var(--acento); transform-origin:left; }
  @keyframes drenar{ from{transform:scaleX(1);} to{transform:scaleX(0);} }

  #botones{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn-color{
    border:none; border-radius:12px; padding:16px 8px; font-weight:800; font-size:1rem;
    color:#fff; cursor:pointer; text-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .btn-color:active{ transform:scale(.97); }
  .btn-color.impar-solo{ grid-column:1 / -1; max-width:200px; margin:0 auto; width:100%; }

  @media (prefers-reduced-motion: reduce){
    #palabra, #palabra.correcto, #barra-relleno{ animation:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎨 Stroop</h1>
  <p class="sub" id="instruccion">Toca el <strong>color en que está escrita</strong> la palabra — no lo que dice.</p>

  <div class="niveles">
    <button data-nivel="facil" class="activo">Fácil</button>
    <button data-nivel="medio">Medio</button>
    <button data-nivel="dificil">Difícil</button>
  </div>

  <div class="stats">
    <div>Aciertos<strong id="stat-aciertos">0 / 0</strong></div>
    <div>Racha<strong id="stat-racha">0</strong></div>
    <div>Mejor racha<strong id="stat-mejor">0</strong></div>
  </div>

  <div class="tablero">
    <div id="regla-badge" style="display:none;"></div>
    <div id="palabra">ROJO</div>
    <div id="feedback"></div>
    <div id="barra-fondo"><div id="barra-relleno"></div></div>
  </div>

  <div id="botones"></div>
</div>

<script>
  var COLORES_TODOS = [
    { nombre: 'ROJO',     valor: 'var(--rojo)' },
    { nombre: 'AZUL',     valor: 'var(--azul)' },
    { nombre: 'VERDE',    valor: 'var(--verde)' },
    { nombre: 'AMARILLO', valor: 'var(--amarillo)' },
    { nombre: 'MORADO',   valor: 'var(--morado)' },
    { nombre: 'NARANJA',  valor: 'var(--naranja)' },
    { nombre: 'ROSA',     valor: 'var(--rosa)' },
  ];

  var NIVELES = {
    facil:   { colores: 5, tiempoMs: 0,    reglaMixta: false, instruccion: 'Toca el <strong>color en que está escrita</strong> la palabra — no lo que dice.' },
    medio:   { colores: 5, tiempoMs: 2500, reglaMixta: false, instruccion: 'Igual que antes, pero ahora contra el reloj — toca el <strong>color de la tinta</strong> antes de que se acabe la barra.' },
    dificil: { colores: 7, tiempoMs: 3000, reglaMixta: true,  instruccion: 'Hay más colores, hay reloj, y la regla puede cambiar — fíjate en la etiqueta de arriba antes de tocar.' },
  };

  var nivelActual = 'facil';
  var aciertos = 0, intentos = 0, racha = 0, mejorRacha = 0;
  var colorCorrectoEsperado = '';
  var reglaActual = 'color'; // 'color' = toca la tinta | 'palabra' = toca lo que dice
  var idTemporizador = null;

  var elPalabra = document.getElementById('palabra');
  var elFeedback = document.getElementById('feedback');
  var elBadge = document.getElementById('regla-badge');
  var elBarraFondo = document.getElementById('barra-fondo');
  var elBarraRelleno = document.getElementById('barra-relleno');
  var elBotones = document.getElementById('botones');

  function claveMejorRacha(nivel) { return 'stroop-mejor-racha-' + nivel; }

  function cambiarNivel(nivel) {
    nivelActual = nivel;
    aciertos = 0; intentos = 0; racha = 0;
    mejorRacha = Number(localStorage.getItem(claveMejorRacha(nivel)) || 0);
    document.getElementById('instruccion').innerHTML = NIVELES[nivel].instruccion;
    document.querySelectorAll('.niveles button').forEach(function (b) {
      b.classList.toggle('activo', b.dataset.nivel === nivel);
    });
    construirBotones();
    actualizarStats();
    nuevaRonda();
  }

  function construirBotones() {
    var cantidad = NIVELES[nivelActual].colores;
    var activos = COLORES_TODOS.slice(0, cantidad);
    var esImpar = cantidad % 2 !== 0;
    elBotones.innerHTML = activos.map(function (c, i) {
      var esUltimoImpar = esImpar && i === activos.length - 1;
      return '<button class="btn-color' + (esUltimoImpar ? ' impar-solo' : '') + '" ' +
        'style="background:' + c.valor + '" onclick="responder(\'' + c.nombre + '\')">' +
        c.nombre.charAt(0) + c.nombre.slice(1).toLowerCase() + '</button>';
    }).join('');
  }

  function actualizarStats() {
    document.getElementById('stat-aciertos').textContent = aciertos + ' / ' + intentos;
    document.getElementById('stat-racha').textContent = racha;
    document.getElementById('stat-mejor').textContent = mejorRacha;
  }

  function detenerTemporizador() {
    if (idTemporizador) { clearTimeout(idTemporizador); idTemporizador = null; }
    elBarraRelleno.style.animation = 'none';
  }

  function nuevaRonda() {
    detenerTemporizador();
    var config = NIVELES[nivelActual];
    var activos = COLORES_TODOS.slice(0, config.colores);
    var palabra = activos[Math.floor(Math.random() * activos.length)];
    var tinta = activos[Math.floor(Math.random() * activos.length)];

    reglaActual = (config.reglaMixta && Math.random() < 0.3) ? 'palabra' : 'color';
    colorCorrectoEsperado = reglaActual === 'color' ? tinta.nombre : palabra.nombre;

    elPalabra.textContent = palabra.nombre;
    elPalabra.style.color = tinta.valor;
    elPalabra.classList.remove('correcto');
    elFeedback.textContent = '';

    if (config.reglaMixta) {
      elBadge.style.display = 'inline-block';
      elBadge.textContent = reglaActual === 'color' ? '👁️ Toca el COLOR de la tinta' : '🔤 Toca lo que DICE la palabra';
    } else {
      elBadge.style.display = 'none';
    }

    if (config.tiempoMs > 0) {
      elBarraFondo.style.display = 'block';
      elBarraRelleno.style.animation = 'none';
      void elBarraRelleno.offsetWidth; // fuerza a "olvidar" el estado anterior antes de animar de nuevo
      elBarraRelleno.style.animation = 'drenar ' + config.tiempoMs + 'ms linear forwards';
      idTemporizador = setTimeout(function () { tiempoAgotado(); }, config.tiempoMs);
    } else {
      elBarraFondo.style.display = 'none';
    }
  }

  function tiempoAgotado() {
    idTemporizador = null;
    intentos++;
    racha = 0;
    elFeedback.textContent = '⏱️ Se acabó el tiempo — era ' + formatear(colorCorrectoEsperado);
    elFeedback.style.color = 'var(--texto-sec)';
    actualizarStats();
    setTimeout(nuevaRonda, 700);
  }

  function formatear(nombre) {
    return nombre.charAt(0) + nombre.slice(1).toLowerCase();
  }

  function responder(elegido) {
    if (NIVELES[nivelActual].tiempoMs > 0 && idTemporizador === null) return; // ya se resolvió esta ronda
    detenerTemporizador();
    intentos++;
    if (elegido === colorCorrectoEsperado) {
      aciertos++;
      racha++;
      if (racha > mejorRacha) {
        mejorRacha = racha;
        try { localStorage.setItem(claveMejorRacha(nivelActual), String(mejorRacha)); } catch (e) {}
      }
      elFeedback.textContent = '✅ ¡Bien!';
      elFeedback.style.color = 'var(--exito)';
      elPalabra.classList.add('correcto');
    } else {
      racha = 0;
      elFeedback.textContent = 'Era ' + formatear(colorCorrectoEsperado);
      elFeedback.style.color = 'var(--texto-sec)';
    }
    actualizarStats();
    setTimeout(nuevaRonda, 650);
  }

  document.querySelectorAll('.niveles button').forEach(function (b) {
    b.addEventListener('click', function () { cambiarNivel(b.dataset.nivel); });
  });

  cambiarNivel('facil');
</script>
</body>
</html>
