<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16445a">
  <title>Sin conexión - R.E.T.O.</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f7f5ed; color: #173b4a; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
    main { width: min(100%, 28rem); text-align: center; }
    h1 { font-size: 1.75rem; }
    p { line-height: 1.6; }
    a { display: inline-block; margin-top: 1rem; padding: .75rem 1rem; background: #16445a; color: #fff; text-decoration: none; border-radius: .5rem; }
  </style>
</head>
<body>
  <main>
    <h1>R.E.T.O.</h1>
    <p>No hay conexión ahora. Las páginas visitadas pueden seguir disponibles; las partidas y funciones que usan el servidor requieren conexión.</p>
    <a href="/">Volver a intentar</a>
  </main>
</body>
</html>
