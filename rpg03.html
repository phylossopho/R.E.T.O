<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo Texto Minimalista</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }
        
        .game-container {
            width: 900px;
            height: 550px;
            border: 6px solid #fff; /* Estilo retro minimalista blanco y negro */
            background-color: #000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: space-between;
        }

        /* Zona de combate ultra simplificada */
        .arena-canvas {
            height: 180px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 2px dashed #444;
        }
        .char-flat { font-size: 24px; font-weight: bold; border: 2px solid #fff; padding: 15px; text-align: center; width: 180px;}

        /* Estadísticas integradas con botones de ventajas */
        .stats-and-items-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #111;
            padding: 10px;
            border: 2px solid #fff;
            margin: 10px 0;
        }
        .hp-text-pixel { font-size: 14px; font-weight: bold; color: #ffeb3b; }
        
        .inline-powers { display: flex; gap: 8px; }
        .btn-item-pixel {
            background: none;
            border: 1px solid #fff;
            color: #fff;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
        }
        .btn-item-pixel:hover { background-color: #fff; color: #000; }

        /* Caja gigante de evaluación */
        .assessment-box {
            flex: 1;
            border: 4px solid #fff;
            background-color: #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .prompt-text { font-size: 16px; margin-bottom: 20px; line-height: 1.5; color: #fff; }
        .prompt-text::before { content: "* "; color: #ff0055; } /* Detalle de asterisco clásico de RPG */

        /* Cuadrícula de respuestas limpia */
        .options-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: auto;
        }
        .btn-pixel-opt {
            background: none;
            border: 2px solid transparent;
            color: #fff;
            text-align: left;
            font-size: 15px;
            padding: 5px;
            cursor: pointer;
        }
        .btn-pixel-opt:hover {
            color: #ffeb3b;
        }
        /* Añade el corazón selector al hacer hover */
        .btn-pixel-opt:hover::before { content: "❤️ "; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Arena básica -->
        <div class="arena-canvas">
            <div class="char-flat">⚔️ CABALLERO<br><span style="font-size:12px; color:#888;">LV 12</span></div>
            <div style="font-size: 30px;">VS</div>
            <div class="char-flat">🧙‍♂️ MAGO FÍS. <br><span style="font-size:12px; color:#888;">LV 15</span></div>
        </div>

        <!-- Fila de Estado y Power-ups integrados -->
        <div class="stats-and-items-row">
            <div class="hp-text-pixel">TU HP: 85 / 100</div>
            <div class="inline-powers">
                <span style="font-size: 11px; color:#aaa; align-self:center; margin-right:5px;">USAR ITEM:</span>
                <button class="btn-item-pixel">[❤️ Poción]</button>
                <button class="btn-item-pixel">[👁️ Pista]</button>
                <button class="btn-item-pixel">[⏳ Tiempo]</button>
            </div>
        </div>

        <!-- Caja de preguntas y respuestas del examen -->
        <div class="assessment-box">
            <div class="prompt-text">Si un rayo de luz pasa del aire al agua, ¿qué fenómeno físico provoca que cambie su dirección y velocidad?</div>
            
            <div class="options-layout">
                <button class="btn-pixel-opt">Reflexión</button>
                <button class="btn-pixel-opt">Difracción</button>
                <button class="btn-pixel-opt">Refracción</button>
                <button class="btn-pixel-opt">Polarización</button>
            </div>
        </div>
    </div>

</body>
</html>
